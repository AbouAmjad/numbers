services:
  numbers:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - numbers_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  numbers_data:
