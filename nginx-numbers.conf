# Include this snippet in the existing HTTPS server block for iskndr.com.
location = /numbers {
    proxy_pass http://127.0.0.1:8101;
}
location = /numbers/ {
    return 308 /numbers$is_args$args;
}
location = /numbers/api/numbers {
    proxy_pass http://127.0.0.1:8101;
    proxy_read_timeout 120s;
}
